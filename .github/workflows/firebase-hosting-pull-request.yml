# Deploy preview channel to Firebase Hosting on Pull Request (Node.js 24 compatible)

name: Deploy to Firebase Hosting on PR
on:
  pull_request:

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build project (if package.json exists)
        if: hashFiles('package.json') != ''
        run: npm ci && npm run build
      - name: Deploy preview channel to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAUREENBARAHONA_CB833 }}
          projectId: maureenbarahona-cb833
